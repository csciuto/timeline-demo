name: Deploy to GitHub Pages

# Every push to main checks the data, then publishes the site with an
# auto-incremented version (v1.<number of commits>) stamped into the footer.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the data
        run: node --test 'tests/*.test.js' && python3 -I -m unittest discover -s tests -p 'test_*.py'
      - name: Stamp version
        run: |
          VERSION="v1.$(git rev-list --count HEAD)"
          sed -i "s|const VERSION = 'dev';|const VERSION = '$VERSION';|" js/app.js
          grep -q "'$VERSION'" js/app.js
          echo "Deploying $VERSION"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
